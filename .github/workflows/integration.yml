name: Integration (live network)

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  live-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Live compare (best-effort)
        env:
          SPECINT_RUN_INTEGRATION: "1"
        run: |
          set +e
          python -m specint compare --terms cooking recipe --max-results 5 \
            --output reports/live-compare.json
          echo "exit=$?"
          test -f reports/live-compare.json
      - name: Upload live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-compare
          path: reports/live-compare.json
          if-no-files-found: warn
