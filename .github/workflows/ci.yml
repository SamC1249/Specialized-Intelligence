name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy, best-effort)
        run: mypy src || true

      - name: Type check (mypy strict on records + quality + domains)
        run: mypy --strict src/specint/records.py src/specint/domains.py src/specint/quality/metrics.py

      - name: Tests (offline)
        env:
          SPECINT_RUN_INTEGRATION: "0"
        run: pytest -q --cov=specint --cov-report=term-missing --cov-report=xml

      - name: E2E compare (fixtures, cooking)
        run: |
          python -m specint compare --fixtures --domain cooking \
            --output reports/ci-compare-cooking.json
          test -s reports/ci-compare-cooking.json

      - name: E2E compare (fixtures, laboratory)
        run: |
          python -m specint compare --fixtures --domain laboratory \
            --output reports/ci-compare-laboratory.json
          test -s reports/ci-compare-laboratory.json

      - name: E2E ablation on fixture corpus
        run: |
          python -m specint ablate --output reports/ci-ablation.json
          test -s reports/ci-ablation.json

      - name: Upload comparison reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: compare-reports
          path: |
            reports/ci-compare-cooking.json
            reports/ci-compare-laboratory.json
            reports/ci-ablation.json

  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
