name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy, best-effort)
        run: mypy src || true

      - name: Fixture audit (fast, no deps)
        run: python scripts/audit_fixtures.py

      - name: Tests (offline)
        env:
          SPECINT_RUN_INTEGRATION: "0"
        run: pytest -q --cov=specint --cov-report=term-missing

      - name: E2E compare (fixtures)
        run: |
          python -m specint compare --fixtures --terms cooking recipe \
            --output reports/ci-compare.json
          test -s reports/ci-compare.json

      - name: Upload comparison report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: compare-report
          path: reports/ci-compare.json

  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  transparency-lint:
    # Placeholder for the EU-AI-Act Art. 53(1)(d) transparency exporter
    # (see docs/plan-2026-08-23.md D4 and docs/artifacts/2026-eu-ai-act-transparency.md).
    # Today this only asserts that the artifact + plan documents exist so
    # a future PR can land the exporter without a workflow diff.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify artifacts and plan are wired in
        run: |
          set -euo pipefail
          test -f docs/artifacts/README.md
          test -f docs/artifacts/2026-eu-ai-act-transparency.md
          test -f docs/artifacts/2026-tdmrep-and-aipref.md
          ls docs/plan-*.md >/dev/null
          echo "transparency prerequisites wired in"
