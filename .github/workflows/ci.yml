name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Strict type check (records + quality)
        run: mypy --strict src/specint/records.py src/specint/quality

      - name: Type check (mypy, best-effort on rest)
        run: mypy src || true

      - name: Registry smoke (all four adapters must be listed)
        run: |
          out=$(python -m specint sources)
          echo "$out"
          for slug in wikimedia archive_org peertube common_crawl; do
            echo "$out" | grep -q "^$slug\b" || { echo "missing slug: $slug"; exit 1; }
          done

      - name: Tests (offline, coverage floor 85%)
        env:
          SPECINT_RUN_INTEGRATION: "0"
        run: pytest -q --cov=specint --cov-report=term-missing --cov-fail-under=85

      - name: E2E compare (fixtures, v1 scorer)
        run: |
          python -m specint compare --fixtures --terms cooking recipe \
            --scorer v1 --output reports/ci-compare.json --quiet
          test -s reports/ci-compare.json

      - name: E2E compare (fixtures, v2 scorer)
        run: |
          python -m specint compare --fixtures --terms cooking recipe \
            --scorer v2 --output reports/ci-compare-v2.json --quiet
          test -s reports/ci-compare-v2.json

      - name: E2E matrix (fixtures, v1 scorer)
        run: |
          python -m specint matrix --fixtures --name ci-suite \
            --scorer v1 --output reports/ci-matrix.json --quiet
          test -s reports/ci-matrix.json

      - name: Diff against committed baseline
        run: |
          python -m specint diff \
            reports/baseline-2026-06-20.json \
            reports/ci-compare.json \
            --output reports/ci-diff.json --quiet
          test -s reports/ci-diff.json

      - name: Upload comparison reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: compare-reports
          path: |
            reports/ci-compare.json
            reports/ci-compare-v2.json
            reports/ci-matrix.json
            reports/ci-diff.json

  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
