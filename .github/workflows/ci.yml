name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy, best-effort)
        run: mypy src || true

      - name: Tests (offline)
        env:
          SPECINT_RUN_INTEGRATION: "0"
        run: pytest -q --cov=specint --cov-report=term-missing --cov-report=xml

      - name: E2E compare (fixtures, head-to-head)
        run: |
          python -m specint compare --fixtures --head-to-head \
            --terms cooking recipe \
            --output reports/ci-compare-scorers.json
          test -s reports/ci-compare-scorers.json

      - name: E2E yield (fixtures)
        run: |
          python -m specint yield --fixtures-dir tests/fixtures \
            --output reports/ci-yield.json
          test -s reports/ci-yield.json

      - name: Upload comparison reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: compare-reports
          path: |
            reports/ci-compare-scorers.json
            reports/ci-yield.json
            coverage.xml

  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pre-commit + package (so local hooks resolve pytest)
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
          pip install -e ".[dev]"
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Live integration tests
        env:
          SPECINT_RUN_INTEGRATION: "1"
        run: pytest -q -m integration
