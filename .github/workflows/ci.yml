name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy, best-effort)
        run: mypy src || true

      - name: Tests (offline)
        env:
          SPECINT_RUN_INTEGRATION: "0"
        run: pytest -q --cov=specint --cov-report=term-missing

      - name: E2E compare (fixtures)
        run: |
          python -m specint compare --fixtures --dedupe --terms cooking recipe \
            --output reports/ci-compare.json
          test -s reports/ci-compare.json
          python -c "import json,sys; p=json.load(open('reports/ci-compare.json')); assert 'dedupe' in p and 'overlap' in p['dedupe'], p"

      - name: E2E dedupe smoke (fixtures)
        run: |
          python -m specint dedupe --fixtures --terms cooking recipe \
            --output reports/ci-dedupe.json
          python -c "import json; p=json.load(open('reports/ci-dedupe.json')); assert p['n_after_dedupe'] <= p['n_records']"

      - name: Regression guard vs committed baseline
        run: |
          python <<'PY'
          import json
          cur = [r for r in json.load(open('reports/ci-compare.json'))['rows']
                 if r['source'] == '__total__'][0]['mean_quality']
          base = [r for r in json.load(open('reports/baseline-2026-06-20.json'))['rows']
                  if r['source'] == '__total__'][0]['mean_quality']
          print(f'aggregate mean_quality current={cur:.4f} baseline={base:.4f}')
          assert cur >= base - 0.05, f'regressed: {cur} < {base} - 0.05'
          PY

      - name: Upload comparison report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: compare-report
          path: |
            reports/ci-compare.json
            reports/ci-dedupe.json

  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
