name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy, best-effort)
        run: mypy src || true

      - name: Tests (offline)
        env:
          SPECINT_RUN_INTEGRATION: "0"
        run: pytest -q --cov=specint --cov-report=term-missing

      - name: E2E compare (fixtures, v1 baseline)
        run: |
          python -m specint compare --fixtures --terms cooking recipe \
            --output reports/ci-compare-v1.json
          test -s reports/ci-compare-v1.json

      - name: E2E compare (fixtures, v2 profile + dedup)
        run: |
          python -m specint compare --fixtures --terms cooking recipe \
            --profile v2 --dedup \
            --output reports/ci-compare-v2-dedup.json
          test -s reports/ci-compare-v2-dedup.json
          python - <<'PY'
          import json, sys
          d = json.load(open("reports/ci-compare-v2-dedup.json"))
          total = [r for r in d["rows"] if r["source"] == "__total__"][0]
          # Dedup must at least be a no-op; on the shipped fixtures the
          # intentional NASA duplicate should reliably fire, so we assert
          # strictly. Failing this signals a regression in the dedup path.
          assert d["profile"] == "v2", d
          assert d["dedup"] is True, d
          assert total["n_unique"] <= total["n_records"], total
          assert total["duplicate_rate"] > 0.0, total
          PY

      - name: E2E yield estimate (fixtures)
        run: |
          python -m specint estimate --fixtures --projected-pages 20 \
            --output reports/ci-estimate.json
          test -s reports/ci-estimate.json

      - name: Upload comparison + estimate reports
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: compare-report
          path: |
            reports/ci-compare-v1.json
            reports/ci-compare-v2-dedup.json
            reports/ci-estimate.json

  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
