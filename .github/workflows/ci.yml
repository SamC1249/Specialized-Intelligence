name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Pre-commit (lint + format + custom hooks)
        env:
          SKIP: pytest-quick
        run: |
          pip install pre-commit
          pre-commit run --all-files --show-diff-on-failure

      - name: Type check (mypy, best-effort)
        run: mypy src || true

      - name: Tests (offline) + coverage
        env:
          SPECINT_RUN_INTEGRATION: "0"
          SPECINT_GIT_SHA: ${{ github.sha }}
        run: |
          pytest -q \
            --cov=specint \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80

      - name: Core-module coverage floor (95%)
        run: |
          python scripts/check_core_coverage.py

      - name: E2E compare (fixtures)
        env:
          SPECINT_GIT_SHA: ${{ github.sha }}
        run: |
          python -m specint compare --fixtures --terms cooking recipe \
            --output reports/ci-compare.json
          test -s reports/ci-compare.json

      - name: Upload comparison report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: compare-report
          path: reports/ci-compare.json

      - name: Upload coverage.xml
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  governance:
    # Cheap, no-network guardrails that fail before more expensive jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 800-line per-file cap
        run: python scripts/check_file_size.py
      - name: No live URLs in offline tests
        run: python scripts/check_no_live_urls_in_tests.py
