name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy, best-effort)
        run: mypy src || true

      - name: Tests (offline)
        env:
          SPECINT_RUN_INTEGRATION: "0"
        run: pytest -q --cov=specint --cov-report=term-missing

      - name: Integration-marker fence
        run: |
          out=$(pytest --collect-only -q -m integration || true)
          echo "$out"
          case "$out" in
            *"0 tests collected"*|*"no tests collected"*|*"no tests ran"*) ;;
            *) echo "integration marker collected tests without opt-in"; exit 1 ;;
          esac

      - name: E2E compare (fixtures, full harness)
        run: |
          python -m specint compare --fixtures --terms cooking recipe \
            --dedupe --detect-language \
            --output reports/ci-compare.json
          test -s reports/ci-compare.json
          python -c "import json; d=json.load(open('reports/ci-compare.json')); assert 'pareto_frontier' in d and 'dedupe' in d and 'language_coverage' in d, d.keys()"

      - name: Upload comparison report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: compare-report
          path: reports/ci-compare.json

  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
