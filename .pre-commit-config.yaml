repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest (offline)
        entry: pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: mypy-src
        name: mypy (best-effort)
        entry: bash -c "mypy src || true"
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: specint-compare
        name: specint compare (fixtures)
        entry: bash -c "python -m specint compare --fixtures --terms cooking recipe --output reports/precommit-compare.json > /dev/null"
        language: system
        pass_filenames: false
        stages: [pre-push]
