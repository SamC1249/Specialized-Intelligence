repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest (offline)
        entry: pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: plan-summary-updated
        name: plan-summary-updated
        description: >-
          When docs/plan-YYYY-MM-DD.md is added or modified, plan.md must
          contain a matching dated summary line (AGENTS.md §5).
        entry: python scripts/check_plan_summary.py
        language: system
        files: ^docs/plan-\d{4}-\d{2}-\d{2}\.md$
