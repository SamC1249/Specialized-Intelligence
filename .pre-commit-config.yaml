repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/codespell-project/codespell
    rev: v2.3.0
    hooks:
      - id: codespell
        additional_dependencies: ["tomli"]
        args: ["--ignore-words-list=cook,cooks,te,thi,nd,mater"]
        exclude: |
          (?x)^(
            reports/.*|
            tests/fixtures/.*|
            agent-tools/.*
          )$
  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest (offline)
        entry: pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: mypy-schema
        name: mypy (records.py — schema module, blocking)
        entry: mypy src/specint/records.py
        language: system
        pass_filenames: false
        stages: [pre-commit]
