repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest (offline)
        entry: pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: sources-registry
        name: sources registry consistency
        entry: python3 scripts/check_sources_registry.py
        language: system
        pass_filenames: false
        files: ^src/specint/sources/.*\.py$
      - id: baseline-regression-gate
        name: baseline regression gate (offline)
        entry: python3 scripts/check_baseline_regression.py
        language: system
        pass_filenames: false
        files: ^(src/specint/.*\.py|tests/fixtures/.*|reports/baseline-.*\.json)$
