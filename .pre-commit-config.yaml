repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.1
    hooks:
      - id: actionlint
  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest (offline)
        entry: pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: check-file-length
        name: file length ≤ 800 lines (AGENTS.md rule)
        entry: python3 scripts/check_file_length.py
        language: system
        types_or: [python, markdown, yaml, json]
        exclude: |
          (?x)^(
            reports/.*|
            tests/fixtures/.*|
            \.github/.*
          )$
