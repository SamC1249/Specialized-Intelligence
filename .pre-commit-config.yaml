repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=512"]
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest (offline)
        entry: pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: baseline-drift
        name: baseline drift check
        entry: python scripts/check_baseline_drift.py
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: mypy-best-effort
        name: mypy (best-effort, non-blocking)
        entry: bash -c "mypy src || true"
        language: system
        pass_filenames: false
        stages: [pre-push]
